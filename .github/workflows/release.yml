name: Debian release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: retrocast-apt-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [bookworm, trixie, jammy, noble, resolute]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and validate
        env:
          DEB_MAINTAINER: ${{ vars.DEB_MAINTAINER || 'RetroCast Maintainer <giliover@users.noreply.github.com>' }}
        run: |
          version=${GITHUB_REF_NAME#v}
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          bash build-deb.sh "$version" "${{ matrix.target }}"
          bash test-deb.sh "$version" "${{ matrix.target }}"
      - uses: actions/upload-artifact@v4
        with:
          name: debian-package-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error
  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: apt-release
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: debian-package-*
          merge-multiple: true
          path: dist
      - name: Prepare repository state
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg
          mkdir "$RUNNER_TEMP/site"
          source packaging/debian/targets.sh
          version=${GITHUB_REF_NAME#v}
          while IFS= read -r suite; do
            expected=$(retrocast_package_version "$version" "$suite")
            url="https://giliover.github.io/retrocast/apt/dists/$suite/main/binary-amd64/Packages.gz"
            status=$(curl --silent --show-error --location --output "$RUNNER_TEMP/current.gz" --write-out '%{http_code}' "$url")
            case "$status" in
              200)
                old=$(gzip -dc "$RUNNER_TEMP/current.gz" | awk '/^Version: / {print $2}')
                test -n "$old"
                if ! dpkg --compare-versions "$expected" gt "$old"; then
                  echo "::error::Version $expected must exceed $old ($suite)"
                  exit 1
                fi ;;
              404) echo "No published index found ($suite)" ;;
              *) echo "::error::Unexpected HTTP status $status ($suite)"; exit 1 ;;
            esac
          done < <(retrocast_targets)
      - name: Sign and index
        env:
          APT_GPG_PRIVATE_KEY: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          APT_GPG_FINGERPRINT: ${{ vars.APT_GPG_FINGERPRINT }}
        run: |
          export GNUPGHOME=$(mktemp -d)
          trap 'rm -rf "$GNUPGHOME"' EXIT
          chmod 700 "$GNUPGHOME"
          printf '%s' "$APT_GPG_PRIVATE_KEY" | gpg --batch --import
          unset APT_GPG_PRIVATE_KEY
          version=${GITHUB_REF_NAME#v}
          bash packaging/apt/publish.sh "$version" dist "$RUNNER_TEMP/site"
          mkdir "$RUNNER_TEMP/public"
          cp -a "$RUNNER_TEMP/site/apt" "$RUNNER_TEMP/site/index.html" "$RUNNER_TEMP/site/.nojekyll" "$RUNNER_TEMP/public/"
          rm -rf "$RUNNER_TEMP/public/apt/db" "$RUNNER_TEMP/public/apt/conf"
          size=$(du -sb "$RUNNER_TEMP/public" | cut -f1)
          if (( size > 1000000000 )); then
            echo "::error::APT site exceeds 1 GB; use alternative package hosting"
            exit 1
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/public
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
