name: Debian CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and smoke test
        env:
          DEB_MAINTAINER: CI <ci@example.invalid>
        run: |
          bash build-deb.sh 0.0.0
          bash test-deb.sh 0.0.0
